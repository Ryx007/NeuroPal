# Memory limits: the build box has 8 GB and no swap and is shared with other
# Gradle builds, so keep the daemon small and compile Kotlin in-process
# (no separate Kotlin daemon eating another ~1 GB).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
