# Release APKs for both Android apps (arm64). Manual, or on main when an app
# changes. The APKs are attached to the run as artifacts (Actions → this run
# → Artifacts). Both are signed with the debug key: fine for sideloading on
# your own phone, not for the Play Store (see docs/PLATFORM-PLAN.md §8).
name: Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "neuropal-expo-app/**"
      - "neuropal-flutter/**"
      - "packages/tokens/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expo-apk:
    name: Expo APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: neuropal-expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuropal-expo-app/package-lock.json
      - run: npm ci
      # The public backend candidates from .env.example (Tailscale name + LAN
      # fallback) are what the APK should try; no secrets live there.
      - run: cp .env.example .env
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Gradle release build (arm64)
        working-directory: neuropal-expo-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: neuropal-expo-apk
          path: neuropal-expo-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  flutter-apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: neuropal-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: neuropal-flutter-apk
          path: neuropal-flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
