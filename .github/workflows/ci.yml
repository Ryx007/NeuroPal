# Fast checks on every push and pull request. Each client gets its own job so
# one red cross tells you which part broke.
name: CI

on:
  push:
    branches: [main, v2-platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests (Classic parity, Signal contrast, Ask Pal, Home rules)
        working-directory: packages/tokens
        run: npm test
      - name: Generated copies are in sync (Expo, platform, backend, Dart, Swift, CSS)
        run: node packages/tokens/scripts/sync.js --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuropal-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuropal-backend/package-lock.json
      - run: npm ci
      - name: Tests (in-memory MongoDB)
        run: npm test

  expo:
    name: Expo app bundles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuropal-expo-app
    env:
      CI: 1
      EXPO_PUBLIC_USE_MOCK: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuropal-expo-app/package-lock.json
      - run: npm ci
      - name: Bundle Android
        run: npx expo export -p android --output-dir "$RUNNER_TEMP/expo-android"
      - name: Bundle iOS
        run: npx expo export -p ios --output-dir "$RUNNER_TEMP/expo-ios"
      - name: Bundle web
        run: npx expo export -p web --output-dir "$RUNNER_TEMP/expo-web"

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuropal-flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Tests (incl. token parity with the JS fixtures)
        run: flutter test

  platform:
    name: Web platform (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuropal-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuropal-platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Static export
        run: npm run build

  web-app:
    name: Web app (browser checks, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # poppler renders PDF page images (the reader's "Original pages"), as
      # in the server's Docker image.
      - name: Backend dependencies
        working-directory: neuropal-backend
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils
          npm ci
      - name: Platform dependencies + Chromium
        working-directory: neuropal-platform
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Static export
        working-directory: neuropal-platform
        run: npm run build
      # Two seeded public-mode APIs (in-memory MongoDB, a labelled fake AI)
      # and the built site; they keep running for the next steps.
      - name: Start the APIs and the site
        working-directory: neuropal-platform
        run: |
          node scripts/qa/dev-api.cjs 4420 > "$RUNNER_TEMP/api-reader.log" 2>&1 &
          node scripts/qa/dev-api.cjs 4410 > "$RUNNER_TEMP/api-shell.log" 2>&1 &
          npm run serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "dev-api" "$RUNNER_TEMP/api-reader.log" && grep -q "dev-api" "$RUNNER_TEMP/api-shell.log" \
              && curl -sf http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP"/*.log
          exit 1
      - name: Library, Reader, Ask
        working-directory: neuropal-platform
        run: node scripts/qa/web-reader.mjs --web http://127.0.0.1:4321 --api http://127.0.0.1:4420 --out "$RUNNER_TEMP/shots-reader"
      - name: Shell, Home, calming steps, Pal, Settings
        working-directory: neuropal-platform
        run: node scripts/qa/web-shell.mjs --web http://127.0.0.1:4321 --api http://127.0.0.1:4410 --out "$RUNNER_TEMP/shots-shell"
      - name: Pal's crisis check matches the backend
        working-directory: neuropal-platform
        run: node scripts/qa/web-shell-crisis.mjs
      - name: The answer renderer stays linear on garbled Markdown
        working-directory: neuropal-platform
        run: node scripts/qa/markdown-timing.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-app-screens
          path: ${{ runner.temp }}/shots-*
          retention-days: 7
