# iOS compile checks on GitHub's macOS runners (no Mac needed locally).
# Simulator builds need no signing; device builds and TestFlight come later,
# once an Apple Developer account and signing secrets exist.
name: iOS builds

on:
  workflow_dispatch:
  push:
    branches: [main, v2-platform, v3-apple-web]
    paths:
      - "neuropal-expo-app/**"
      - "neuropal-flutter/**"
      - "neuropal-ios/**"
      - "packages/tokens/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expo-ios:
    name: Expo app (simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: neuropal-expo-app
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neuropal-expo-app/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
      - name: CocoaPods
        working-directory: neuropal-expo-app/ios
        run: pod install
      - name: Build for the iOS simulator
        working-directory: neuropal-expo-app/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80

  flutter-ios:
    name: Flutter app + Swift widget (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: neuropal-flutter
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build for the iOS simulator
        run: flutter build ios --simulator --debug
      # flutter hides xcodebuild's target list, so prove the Swift extension
      # was really compiled and embedded rather than silently skipped.
      - name: The widget extension is embedded
        run: |
          ls -la build/ios/iphonesimulator/Runner.app/PlugIns/
          test -x build/ios/iphonesimulator/Runner.app/PlugIns/NeuroPalWidget.appex/NeuroPalWidget

  # The native SwiftUI app (neuropal-ios): the Xcode project is generated
  # from project.yml, so XcodeGen comes first. NeuroPalCore's tests run on
  # macOS itself (no simulator needed).
  native-ios:
    name: Native iOS app (simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: neuropal-ios
        run: xcodegen generate
      - name: Build for the iOS simulator
        working-directory: neuropal-ios
        run: |
          set -o pipefail
          xcodebuild -project NeuroPal.xcodeproj -scheme NeuroPal -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
      # Prove the widget extension was compiled and embedded, not skipped.
      - name: The widget extension is embedded
        working-directory: neuropal-ios
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/NeuroPal.app
          ls -la "$APP/PlugIns/"
          test -x "$APP/PlugIns/NeuroPalWidgets.appex/NeuroPalWidgets"
      - name: NeuroPalCore tests (macOS)
        run: swift test --package-path neuropal-ios/Packages/NeuroPalCore
